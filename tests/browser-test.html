<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dangote Electrical Academy browser tests</title>
  <style>body { font: 16px system-ui, sans-serif; padding: 2rem; } .pass { color: green; } .fail { color: darkred; }</style>
</head>
<body>
  <h1>Browser tests</h1>
  <ul id="results"></ul>
  <script src="../core.js?v=20261013-plc1"></script>
  <iframe id="app" src="../index.html?browser-test=1&v=20261013-plc1" hidden title="application under test"></iframe>
  <script>
    const results = document.querySelector('#results');
    const tests = [
      ['valid load sizing', () => DangoteAcademyCore.calculateLoadSizing({ phase: 1, loadType: 'kw', loadValue: 10, pf: .85, diversity: .8, installMethod: 'conduit' }).valid],
      ['dashboard reports local data and safely escapes project names', () => {
        const app = testApp();
        const keys = ['dangote-academy-projects', 'dangote-academy-lessons', 'dangote-academy-troubleshooting', 'dangote-academy-installation', 'dangote-academy-station-diagnostics', 'dangote-academy-electronics-diagnostics'];
        const previous = keys.map(key => app.localStorage.getItem(key));
        try {
          app.localStorage.setItem(keys[0], JSON.stringify([{
            name: '<img src=x onerror=alert(1)>',
            savedAt: new Date().toISOString(),
            status: 'draft'
          }]));
          app.localStorage.setItem(keys[1], JSON.stringify({ 'safe-topology': { completedAt: new Date().toISOString() } }));
          app.localStorage.setItem(keys[2], JSON.stringify({ 'scenario-0': { completed: true, attempts: 2, completedAt: new Date().toISOString() } }));
          app.renderDashboard();
          const activity = app.document.querySelector('#dashboard-activity');
          return app.document.querySelector('#dashboard-project-count').textContent === '1' &&
            app.document.querySelector('#dashboard-lesson-count').textContent === '1 / 3' &&
            app.document.querySelector('#dashboard-scenario-count').textContent === '1 / 8' &&
            activity.querySelectorAll('img').length === 0 &&
            activity.textContent.includes('<img src=x onerror=alert(1)>') &&
            !activity.textContent.includes('John Doe');
        } finally {
          keys.forEach((key, index) => {
            if (previous[index] === null) app.localStorage.removeItem(key);
            else app.localStorage.setItem(key, previous[index]);
          });
          app.renderDashboard();
        }
      }],
      ['invalid power factor rejected', () => !DangoteAcademyCore.calculateLoadSizing({ phase: 1, loadType: 'kw', loadValue: 10, pf: 1.2, diversity: .8, installMethod: 'clipped' }).valid],
      ['schedule demand calculated', () => DangoteAcademyCore.calculateScheduleSizing({ phase: 1, method: 'clipped', rcd: 'recommended', rows: [{ load: 1.2, quantity: 1, pf: .95, diversity: .8 }] }).demand === .96],
      ['transistor base resistor meets forced-beta drive with a safe E12 value', () => {
        const result = DangoteAcademyCore.calculateTransistorBaseResistor({
          controlVoltage: 3.3, baseEmitterVoltage: .7, collectorCurrentMa: 20, forcedBeta: 10
        });
        return result.valid && result.maximumResistance === 1300 &&
          result.standardResistance === 1200 && result.availableCollectorCurrentMa >= 20;
      }],
      ['transistor base resistor rejects unsafe drive inputs', () =>
        !DangoteAcademyCore.calculateTransistorBaseResistor({
          controlVoltage: 3.3, baseEmitterVoltage: 3.3, collectorCurrentMa: 20, forcedBeta: 10
        }).valid],
      ['correction factors change cable selection', () => DangoteAcademyCore.calculateLoadSizing({ phase: 1, loadType: 'kw', loadValue: 10, pf: .85, diversity: .8, installMethod: 'conduit', cableLength: 75, ambientFactor: .94, groupingFactor: .8 }).cable.size === 25],
      ['selected breaker rating is coordinated to derated cable capacity', () => {
        const result = DangoteAcademyCore.calculateLoadSizing({ phase: 1, loadType: 'kw', loadValue: 10, pf: .85, diversity: .8, installMethod: 'conduit' });
        return result.protectionCoordinated && result.breakerRating >= result.current &&
          result.breakerRating <= result.actualCapacity;
      }],
      ['motor feeder estimate uses efficiency and starting-current multiple', () => {
        const result = DangoteAcademyCore.calculateMotorDesign({
          powerKw: 15, voltage: 400, powerFactor: .85, efficiency: .9,
          startingCurrentMultiple: 6, cableLength: 40, installMethod: 'tray'
        });
        return result.valid && result.current === 28.3 && result.startingCurrent === 169.81 &&
          result.withinCapacity && result.protectionCoordinated;
      }],
      ['invalid cable length rejected', () => !DangoteAcademyCore.calculateLoadSizing({ phase: 1, loadType: 'kw', loadValue: 10, pf: .85, diversity: .8, installMethod: 'conduit', cableLength: 0 }).valid],
      ['three-phase voltage applied', () => DangoteAcademyCore.calculateLoadSizing({ phase: 3, loadType: 'kw', loadValue: 15, pf: .9, diversity: 1, installMethod: 'tray' }).voltage === 400],
      ['three-phase current calculated', () => DangoteAcademyCore.calculateLoadSizing({ phase: 3, loadType: 'kw', loadValue: 15, pf: .9, diversity: 1, installMethod: 'tray' }).current === 24.06],
      ['load sizing rejects unsupported and non-finite inputs', () =>
        !DangoteAcademyCore.calculateLoadSizing({ phase: 2, loadType: 'kw', loadValue: 10, pf: .9, diversity: 1, installMethod: 'tray' }).valid &&
        !DangoteAcademyCore.calculateLoadSizing({ phase: 1, loadType: 'kw', loadValue: Infinity, pf: .9, diversity: 1, installMethod: 'tray' }).valid],
      ['load sizing rejects finite inputs with overflowing derived values', () =>
        !DangoteAcademyCore.calculateLoadSizing({ phase: 1, loadType: 'kw', loadValue: Number.MAX_VALUE, pf: 1, diversity: 1, installMethod: 'tray' }).valid],
      ['load sizing flags demand beyond the cable table', () => {
        const result = DangoteAcademyCore.calculateLoadSizing({ phase: 3, loadType: 'kw', loadValue: 2000, pf: .9, diversity: 1, installMethod: 'clipped' });
        return result.valid && result.withinCapacity === false;
      }],
      ['schedule rejects empty and invalid rows', () =>
        !DangoteAcademyCore.calculateScheduleSizing({ phase: 1, method: 'clipped', rcd: 'recommended', rows: [] }).valid &&
        !DangoteAcademyCore.calculateScheduleSizing({ phase: 1, method: 'clipped', rcd: 'recommended', rows: [{ load: NaN, quantity: 1, pf: .9, diversity: 1 }] }).valid],
      ['schedule rejects overflowing aggregate values', () =>
        !DangoteAcademyCore.calculateScheduleSizing({ phase: 1, method: 'clipped', rcd: 'recommended', rows: [{ load: Number.MAX_VALUE, quantity: 1, pf: .01, diversity: 1 }] }).valid],
      ['linear circuit validates', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'line'), connection('mcb', 'lamp', 'line')
        ]);
        return app.validateCircuit() && app.document.querySelector('#circuit-message').textContent.includes('complete');
      }],
      ['protected-lamp walkthrough gates each step and completes without replacing the canvas', () => {
        const app = testApp();
        loadCircuit(app, []);
        app.startCircuitWalkthrough();
        app.document.querySelector('#walkthrough-check').click();
        const blockedAtSource = app.document.querySelector('#walkthrough-count').textContent === 'Step 1 of 6';
        loadCircuit(app, ['source-ac']);
        app.document.querySelector('#walkthrough-check').click();
        const sourceAccepted = app.document.querySelector('#walkthrough-count').textContent === 'Step 2 of 6';
        loadCircuit(app, ['source-ac', 'mcb', 'lamp']);
        app.document.querySelector('#walkthrough-check').click();
        app.document.querySelector('#walkthrough-check').click();
        app.document.querySelector('#walkthrough-check').click();
        const connectionRequired = app.document.querySelector('#walkthrough-count').textContent === 'Step 4 of 6';
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'line'), connection('mcb', 'lamp', 'line'),
          connection('lamp', 'source', 'neutral')
        ]);
        app.document.querySelector('#walkthrough-check').click();
        app.document.querySelector('#walkthrough-check').click();
        app.document.querySelector('#walkthrough-check').click();
        return blockedAtSource && sourceAccepted && connectionRequired &&
          app.document.querySelector('#walkthrough-count').textContent === 'Complete' &&
          app.document.querySelectorAll('#circuit-canvas .circuit-component').length === 3 &&
          app.document.querySelector('#walkthrough-check').disabled;
      }],
      ['virtual meter and scope reflect simulation models and stop safely', () => {
        const app = testApp();
        const mode = app.document.querySelector('#meter-measurement');
        const value = app.document.querySelector('#meter-value');
        const scope = app.document.querySelector('#scope-mode');
        const button = app.document.querySelector('#simulate-circuit');
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'line'), connection('mcb', 'lamp', 'line'),
          connection('lamp', 'source', 'neutral')
        ]);
        mode.value = 'continuity';
        app.renderVirtualInstruments();
        const continuity = value.textContent === 'CLOSED' &&
          app.document.querySelector('#meter-note').textContent.includes('not a physical continuity test');
        let acReadings = false;
        let runningContinuity = false;
        try {
          mode.value = 'source-voltage';
          app.toggleSimulation();
          acReadings = value.textContent === '230' && scope.textContent.includes('AC') &&
            app.document.querySelector('#scope-trace').getAttribute('d').includes('L') &&
            Number(app.document.querySelector('#sim-i').textContent) === .5;
          mode.value = 'circuit-power';
          app.renderVirtualInstruments();
          acReadings = acReadings && value.textContent === '115';
          mode.value = 'continuity';
          app.renderVirtualInstruments();
          runningContinuity = value.textContent === 'STOP';
        } finally {
          if (button.textContent.includes('Stop simulation')) app.toggleSimulation();
        }
        const stoppedState = value.textContent === 'CLOSED' &&
          scope.textContent.includes('No energized signal');
        loadCircuit(app, ['battery', 'mcb', 'lamp'], [
          connection('battery', 'mcb', 'line'), connection('mcb', 'lamp', 'line'),
          connection('lamp', 'battery', 'neutral')
        ]);
        mode.value = 'source-voltage';
        app.toggleSimulation();
        const dcReading = value.textContent === '12' && scope.textContent.includes('DC');
        app.toggleSimulation();
        return continuity && acReadings && runningContinuity && stoppedState && dcReading;
      }],
      ['guided electronics projects show low-voltage materials and supervision guidance', () => {
        const app = testApp();
        const cards = [...app.document.querySelectorAll('.guided-project-card')];
        return cards.length === 3 &&
          cards[0].textContent.includes('5 V current-limited supply') &&
          cards[1].textContent.includes('suitable voltage rating') &&
          cards[2].textContent.includes('exact datasheet') &&
          app.document.querySelector('.project-safety-note').textContent.includes('not construction instructions for mains');
      }],
      ['circuit validation requires exactly one source', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'battery', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'line'),
          connection('mcb', 'lamp', 'line'),
          { ...connection('battery', 'lamp', 'line'), toTerminal: 'out' }
        ]);
        return !app.validateCircuit() &&
          app.document.querySelector('#circuit-message').textContent.includes('one source');
      }],
      ['circuit validation rejects protection outside the line path', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'lamp', 'line'),
          connection('source', 'mcb', 'neutral')
        ]);
        return !app.validateCircuit() &&
          app.document.querySelector('#circuit-message').textContent.includes('line / phase path');
      }],
      ['circuit validation rejects disconnected components despite extra wiring', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'lamp', 'relay'], [
          connection('source', 'mcb', 'line'),
          connection('mcb', 'lamp', 'line'),
          { ...connection('lamp', 'source', 'line'), fromTerminal: 'out', toTerminal: 'out' }
        ]);
        return !app.validateCircuit() &&
          app.document.querySelector('#circuit-message').textContent.includes('every component');
      }],
      ['junction branching validates both branches', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'junction', 'lamp', 'socket'], [
          connection('source', 'mcb', 'line'), connection('mcb', 'junction', 'line'),
          { ...connection('junction', 'lamp', 'phase-a'), fromTerminal: 'branch-a' }, { ...connection('junction', 'socket', 'phase-a'), fromTerminal: 'branch-b' }
        ]);
        return app.validateCircuit();
      }],
      ['neutral-only circuit is rejected', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'neutral'), connection('mcb', 'lamp', 'neutral')
        ]);
        return !app.validateCircuit() && app.document.querySelector('#circuit-message').textContent.includes('line / phase');
      }],
      ['earth leakage requires RCD and earth path', () => {
        const app = testApp();
        const fault = app.document.querySelector('#circuit-fault');
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'line'), connection('mcb', 'lamp', 'line')
        ]);
        fault.value = 'earth-leakage';
        fault.dispatchEvent(new app.Event('change'));
        const rejected = !app.validateCircuit();
        loadCircuit(app, ['source-ac', 'rcd', 'lamp'], [
          connection('source', 'rcd', 'line'), connection('rcd', 'lamp', 'line'),
          connection('source', 'lamp', 'earth')
        ]);
        fault.value = 'earth-leakage';
        fault.dispatchEvent(new app.Event('change'));
        return rejected && app.validateCircuit();
      }],
      ['fault modes update simulation safely', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'line'), connection('mcb', 'lamp', 'line')
        ]);
        const fault = app.document.querySelector('#circuit-fault');
        if (app.document.querySelector('#simulate-circuit').textContent.includes('Run simulation')) app.toggleSimulation();
        fault.value = 'open'; fault.dispatchEvent(new app.Event('change'));
        const open = app.document.querySelector('#sim-status').textContent.includes('open circuit');
        fault.value = 'short'; fault.dispatchEvent(new app.Event('change'));
        const short = app.document.querySelector('#sim-i').textContent === '80.0';
        fault.value = 'none'; fault.dispatchEvent(new app.Event('change'));
        const normal = app.document.querySelector('#sim-v').textContent === '230';
        app.toggleSimulation();
        return open && short && normal;
      }],
      ['loose-connection fault updates diagnostics and the selected trend plot', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'line'), connection('mcb', 'lamp', 'line')
        ]);
        app.toggleSimulation();
        const normalCurrent = Number(app.document.querySelector('#sim-i').textContent);
        const fault = app.document.querySelector('#circuit-fault');
        fault.value = 'loose-connection';
        fault.dispatchEvent(new app.Event('change'));
        const diagnosis = app.document.querySelector('#sim-status').textContent === 'Fault: loose connection' &&
          app.document.querySelector('#circuit-message').textContent.includes('reduces current') &&
          Number(app.document.querySelector('#sim-i').textContent) < normalCurrent &&
          app.document.querySelector('#circuit-trend-plot .plot-svg');
        app.toggleSimulation();
        fault.value = 'none';
        fault.dispatchEvent(new app.Event('change'));
        return diagnosis;
      }],
      ['undo and redo restore circuit changes', () => {
        const app = testApp();
        loadCircuit(app, []);
        const before = app.document.querySelectorAll('.circuit-component').length;
        app.createComponent('lamp', 20, 20);
        const added = app.document.querySelectorAll('.circuit-component').length === before + 1;
        app.undoCircuit();
        const undone = app.document.querySelectorAll('.circuit-component').length === before;
        app.redoCircuit();
        return added && undone && app.document.querySelectorAll('.circuit-component').length === before + 1;
      }],
      ['save and load preserve circuit JSON', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'phase-b'), connection('mcb', 'lamp', 'phase-b')
        ]);
        app.saveCircuit();
        const saved = JSON.parse(app.localStorage.getItem('dangote-academy-circuit'));
        loadCircuit(app, []);
        app.loadCircuit();
        const restored = app.serialiseCircuit();
        return saved.version === 2 && restored.components.length === 3 && restored.connections[0].conductor === 'phase-b';
      }],
      ['advanced circuit parts preserve adjustable values through save and restore', () => {
        const app = testApp();
        app.restoreCircuit({ version: 2, components: [], connections: [] });
        const id = app.createComponent('resistor', 40, 40);
        app.document.querySelector(`#${id}`).click();
        const value = app.document.querySelector('#component-value-input');
        value.value = '2200';
        app.applyCircuitComponentValue();
        const saved = app.serialiseCircuit();
        app.restoreCircuit(saved);
        const restored = app.serialiseCircuit();
        const invalid = JSON.parse(JSON.stringify(saved));
        invalid.components[0].value = 2000000;
        let rejected = false;
        try { app.restoreCircuit(invalid); } catch (error) { rejected = error.message.includes('component'); }
        return restored.components[0].type === 'resistor' && restored.components[0].value === 2200 &&
          rejected && app.serialiseCircuit().components[0].value === 2200 &&
          app.document.querySelectorAll('.component-drag[data-type]').length >= 20;
      }],
      ['bench-supply LED circuit validates and plots modeled current safely', () => {
        const app = testApp();
        app.restoreCircuit({
          version: 2,
          components: [
            { id: 'bench', type: 'bench-supply', left: 0, top: 0 },
            { id: 'fuse', type: 'fuse', left: 120, top: 0 },
            { id: 'resistor', type: 'resistor', value: 1000, left: 240, top: 0 },
            { id: 'led', type: 'led', value: 10, left: 360, top: 0 }
          ],
          connections: [
            { from: 'bench', to: 'fuse', fromTerminal: 'out', toTerminal: 'in', conductor: 'line' },
            { from: 'fuse', to: 'resistor', fromTerminal: 'out', toTerminal: 'in', conductor: 'line' },
            { from: 'resistor', to: 'led', fromTerminal: 'out', toTerminal: 'in', conductor: 'line' },
            { from: 'led', to: 'bench', fromTerminal: 'out', toTerminal: 'in', conductor: 'line' }
          ]
        });
        const valid = app.validateCircuit();
        app.toggleSimulation();
        const safeLowVoltage = app.document.querySelector('#sim-v').textContent === '5' &&
          Number(app.document.querySelector('#sim-i').textContent) > 0 &&
          app.document.querySelector('#circuit-trend-plot .plot-svg');
        app.toggleSimulation();
        app.restoreCircuit({
          version: 2,
          components: [
            { id: 'bench', type: 'bench-supply', left: 0, top: 0 },
            { id: 'fuse', type: 'fuse', left: 120, top: 0 },
            { id: 'led', type: 'led', left: 240, top: 0 }
          ],
          connections: [
            { from: 'bench', to: 'fuse', conductor: 'line' },
            { from: 'fuse', to: 'led', conductor: 'line' },
            { from: 'led', to: 'bench', conductor: 'line' }
          ]
        });
        return valid && safeLowVoltage && !app.validateCircuit() &&
          app.document.querySelector('#circuit-message').textContent.includes('series resistor');
      }],
      ['engineering worksheets and circuit simulation expose plotted results', () => {
        const app = testApp();
        const electricalPlots = app.document.querySelector('#load-sizing-plot .plot-svg') &&
          app.document.querySelector('#schedule-phase-plot .plot-svg') &&
          app.document.querySelector('#motor-design-plot .plot-svg');
        app.document.querySelector('#electronics-led-form').dispatchEvent(new app.Event('submit', { bubbles: true, cancelable: true }));
        app.document.querySelector('#electronics-divider-form').dispatchEvent(new app.Event('submit', { bubbles: true, cancelable: true }));
        app.document.querySelector('#electronics-rc-form').dispatchEvent(new app.Event('submit', { bubbles: true, cancelable: true }));
        app.document.querySelector('#electronics-bjt-form').dispatchEvent(new app.Event('submit', { bubbles: true, cancelable: true }));
        return Boolean(electricalPlots &&
          app.document.querySelector('#electronics-led-plot .plot-svg') &&
          app.document.querySelector('#electronics-divider-plot .plot-svg') &&
          app.document.querySelector('#electronics-rc-plot .plot-svg') &&
          app.document.querySelector('#electronics-bjt-plot .plot-svg') &&
          app.document.querySelector('#electronics-bjt-result').textContent.includes('1200 Ω'));
      }],
      ['version one JSON migrates with default terminals and line conductor', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'lamp'], [connection('source', 'lamp', undefined, false)]);
        const legacy = { version: 1, components: [
          { id: 'source', type: 'source-ac', left: 0, top: 0 },
          { id: 'lamp', type: 'lamp', left: 100, top: 0 }
        ], connections: [{ from: 'source', to: 'lamp' }] };
        app.restoreCircuit(legacy);
        const migrated = app.serialiseCircuit();
        return migrated.version === 2 && migrated.connections[0].conductor === 'line' &&
          migrated.connections[0].fromTerminal === 'out' && migrated.connections[0].toTerminal === 'in';
      }],
      ['conductor types persist through restore', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'lamp'], [connection('source', 'lamp', 'earth')]);
        const before = app.serialiseCircuit().connections[0].conductor;
        const json = app.serialiseCircuit();
        app.restoreCircuit(json);
        return before === 'earth' && app.serialiseCircuit().connections[0].conductor === 'earth';
      }],
      ['invalid conductor import is rejected without mutation', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'lamp'], [connection('source', 'lamp', 'line')]);
        const before = app.serialiseCircuit().components.length;
        const invalid = app.serialiseCircuit();
        invalid.connections[0].conductor = 'telepathy';
        let rejected = false;
        try { app.restoreCircuit(invalid); } catch (error) { rejected = error.message.includes('conductor'); }
        return rejected && app.serialiseCircuit().components.length === before;
      }],
      ['malformed circuit import is rejected before changing the workspace', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'lamp'], [connection('source', 'lamp')]);
        const before = JSON.stringify(app.serialiseCircuit());
        const invalid = app.serialiseCircuit();
        invalid.components[1].type = 'unknown-component';
        let rejected = false;
        try { app.restoreCircuit(invalid); } catch (error) { rejected = error.message.includes('component'); }
        return rejected && JSON.stringify(app.serialiseCircuit()) === before;
      }],
      ['duplicate destination terminals are rejected', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'junction', 'lamp'], [
          connection('source', 'mcb', 'line'),
          connection('mcb', 'junction', 'line'),
          { ...connection('junction', 'lamp', 'line'), fromTerminal: 'branch-a' }
        ]);
        const before = JSON.stringify(app.serialiseCircuit());
        const invalid = app.serialiseCircuit();
        invalid.connections.push({ ...invalid.connections[2], fromTerminal: 'branch-b' });
        let rejected = false;
        try { app.restoreCircuit(invalid); } catch (error) { rejected = error.message.includes('Duplicate destination'); }
        return rejected && JSON.stringify(app.serialiseCircuit()) === before;
      }],
      ['projects persist BOQ, circuit, and revisions', () => {
        const app = testApp();
        loadCircuit(app, ['source-ac', 'mcb', 'lamp'], [
          connection('source', 'mcb', 'phase-c'), connection('mcb', 'lamp', 'phase-c')
        ]);
        app.document.querySelector('#project-name').value = 'Browser project';
        app.saveNamedProject();
        const saved = JSON.parse(app.localStorage.getItem('dangote-academy-projects'));
        const savedProject = saved.find(project => project.name === 'Browser project');
        return savedProject && savedProject.circuit.version === 2 &&
          savedProject.circuit.connections[0].conductor === 'phase-c' && Array.isArray(savedProject.revisions);
      }],
      ['projects persist and restore load sizing inputs with revisions', () => {
        const app = testApp();
        const name = `Sizing inputs ${Date.now()}`;
        app.restoreLoadSizingInputs({
          phase: 1, loadType: 'kw', loadValue: '2', pf: '.9', diversity: '.8',
          cableLength: '75', ambientFactor: .94, groupingFactor: .8, installMethod: 'conduit'
        });
        const numericFactorsRestored = app.getLoadSizingInputs().ambientFactor === '.94' &&
          app.getLoadSizingInputs().groupingFactor === '.8';
        const setInputs = length => {
          app.document.querySelector('#calc-phase').value = '1';
          app.document.querySelector('#calc-load-type').value = 'kw';
          app.document.querySelector('#calc-load-value').value = '2';
          app.document.querySelector('#calc-pf').value = '.9';
          app.document.querySelector('#calc-diversity').value = '.8';
          app.document.querySelector('#calc-length').value = String(length);
          app.document.querySelector('#calc-ambient').value = '.94';
          app.document.querySelector('#calc-grouping').value = '.8';
          app.document.querySelector('#calc-install-method').value = 'conduit';
          app.calculateLoad({ preventDefault() {} });
        };
        setInputs(75);

    function connection(from, to, conductor = 'line', terminals = true) {
      return { from, to, conductor, ...(terminals ? { fromTerminal: 'out', toTerminal: 'in' } : {}) };
    }
    function loadCircuit(app, types, connections = []) {
      app.restoreCircuit({
        version: 2,
        components: types.map((type, index) => ({ id: type === 'source-ac' ? 'source' : `${type}-${index}`, type, left: index * 120, top: 0 })),
        connections: connections.map(item => ({ ...item, from: item.from === 'source' ? 'source' : `${item.from}-${types.indexOf(item.from)}`, to: item.to === 'source' ? 'source' : `${item.to}-${types.indexOf(item.to)}` }))
      });
    }
    function runTests() {
      const app = testApp();
      const originalStorage = snapshotStorage(app.localStorage);
      tests.forEach(([name, run]) => {
        restoreStorage(app.localStorage, originalStorage);
        const item = document.createElement('li');
        try {
          if (!run()) throw new Error('assertion failed');
          item.className = 'pass';
          item.textContent = `PASS: ${name}`;
        } catch (error) {
          item.className = 'fail';
          item.textContent = `FAIL: ${name} (${error.message})`;
        } finally {
          restoreStorage(app.localStorage, originalStorage);
        }
        results.appendChild(item);
      });
      app.location.reload();
    }
    function snapshotStorage(storage) {
      return Array.from({ length: storage.length }, (_, index) => {
        const key = storage.key(index);
        return [key, storage.getItem(key)];
      });
    }
    function restoreStorage(storage, snapshot) {
      storage.clear();
      snapshot.forEach(([key, value]) => storage.setItem(key, value));
    }
    document.querySelector('#app').addEventListener('load', runTests, { once: true });
